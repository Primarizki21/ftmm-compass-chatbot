services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftmm-compass-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ftmm-network
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      - OLLAMA_NUM_CTX=2048
      - LLM_BACKEND=bonsai
      - LLM_MODEL_NAME=bonsai-2-4b
      - BONSAI_HOST=http://host.docker.internal:8080
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  ftmm-network:
    external: true
