services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftmm-compass-chatbot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
      - ./src:/app/src
