services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftmm-compass-chatbot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      # Satu-satunya override container: path sesi di dalam image.
      - SESSION_DB_PATH=/app/sessions/sessions.db
    volumes:
      - ./data:/app/data:ro
      - chatbot-sessions:/app/sessions:rw
      - ./src:/app/src:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
          pids: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  chatbot-sessions:
