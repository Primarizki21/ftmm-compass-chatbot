services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftmm-compass-chatbot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      - OLLAMA_NUM_CTX=2048
      - LLM_BACKEND=${LLM_BACKEND:-nine_router}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-ag/gemini-3.8-flash-low}
      - NINE_ROUTER_HOST=${NINE_ROUTER_HOST:-http://127.0.0.1:20128}
      - NINE_ROUTER_API_KEY=${NINE_ROUTER_API_KEY:-}
      - BONSAI_HOST=${BONSAI_HOST:-http://127.0.0.1:8080}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
      - EMBED_MODEL_NAME=${EMBED_MODEL_NAME:-nomic-embed-text-v2-moe}
      - SESSION_STORE_BACKEND=sqlite
      - SESSION_DB_PATH=/app/sessions/sessions.db
      - MAX_CONCURRENT_INFERENCE=1
      - MAX_QUEUE_WAIT_SECONDS=10.0
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8001,http://localhost:3000
    volumes:
      - ./data:/app/data:ro
      - chatbot-sessions:/app/sessions:rw
      - ./src:/app/src:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
          pids: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  chatbot-sessions:
