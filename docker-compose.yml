services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftmm-compass-chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    volumes:
      - ./data:/app/data
      - ./src:/app/src
